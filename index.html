<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Estações | FullCharge</title>
    
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1ywz6_yQYzvAhd3lMx3R4Q1UvniyBuBwx">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        :root { --primary: #00A86B; --accent: #007BFF; --bg: #F8FAFC; --white: #FFFFFF; --text: #1E293B; --border: #E2E8F0; }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); overflow: hidden; }
        #app-container { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
        
        #sidebar { background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; z-index: 1000; }
        .sidebar-header { padding: 25px 25px 15px; text-align: center; flex-shrink: 0; }
        .logo-container { width: 160px; height: 60px; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; }
        .logo-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .subtitle { color: #64748b; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin: 5px 0; }
        
        .search-container { padding: 10px 20px; background: #fff; border-bottom: 1px solid var(--border); }
        #searchInput { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Inter', sans-serif; outline: none; box-sizing: border-box; font-size: 14px; }

        .actions-bar { padding: 10px 20px; display: flex; gap: 8px; background: #f8fafc; border-bottom: 1px solid var(--border); }
        .btn-action { flex: 1; padding: 8px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: white; }
        .btn-deselect { color: #ef4444; }
        .btn-select-all { color: var(--primary); }

        #stationList { flex: 1; overflow-y: auto; padding: 15px; background: #fcfcfc; }
        
        .loading-msg { 
            text-align: center; padding: 40px 20px; color: #64748b; font-weight: 600;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .station-card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .station-card:hover { border-color: var(--primary); background: #f0fdf4; }
        .select-box { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
        .mini-icon { width: 35px; height: 35px; object-fit: contain; }
        
        .potencia-blink {
            color: var(--primary); font-weight: 800; font-size: 12px; display: block; margin-top: 3px;
            animation: flash 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ESTILOS DE STATUS DOS CARDS */
        .card-vendida { border-left: 4px solid var(--primary); }
        .card-disponivel { border-left: 4px solid var(--accent); }

        .badge-status {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }
        .badge-vendida { background: #dcfce7; color: var(--primary); }
        .badge-disponivel { background: #dbeafe; color: var(--accent); }

        /* BOTÃO DO CARRINHO DE COMPRAS MINIMALISTA */
        .btn-cart {
            background: transparent;
            border: none;
            padding: 5px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-cart:hover { transform: scale(1.15); }
        .cart-vendida { color: var(--primary); }
        .cart-disponivel { color: var(--accent); }

        /* ANIMAÇÃO DA BOLINHA VERDE NO MAPA */
        .piscar-verde {
            animation: radar-verde 1.5s infinite;
        }
        @keyframes radar-verde {
            0% { box-shadow: 0 0 0 0 rgba(0, 168, 107, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 168, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 168, 107, 0); }
        }

        .sidebar-footer { padding: 15px; border-top: 1px solid var(--border); background: var(--white); }
        .btn-report { background: var(--text); color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; font-size: 14px; }
        
        #map { height: 100%; width: 100%; z-index: 1; }
        .btn-popup { border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; color: white; width: 100%; text-align: center; background: var(--primary); }
        .custom-div-icon { background: transparent; border: none; }

        /* ESTILOS DO MODAL DE SENHA */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: var(--white); padding: 25px; border-radius: 12px; width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
        }
        .modal-content h3 { margin: 0 0 10px 0; color: var(--text); font-size: 18px; }
        .modal-content p { font-size: 13px; color: #64748b; margin-bottom: 20px; }
        .modal-content input {
            width: 100%; padding: 12px; margin-bottom: 20px;
            border: 1px solid var(--border); border-radius: 8px;
            box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 16px;
            text-align: center; outline: none; transition: 0.2s;
        }
        .modal-content input:focus { border-color: var(--primary); }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button {
            flex: 1; padding: 12px; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: 700; font-size: 14px; transition: 0.2s;
        }
        .btn-cancel { background: #e2e8f0; color: var(--text); }
        .btn-cancel:hover { background: #cbd5e1; }
        .btn-confirm { background: var(--primary); color: white; }
        .btn-confirm:hover { background: #008f5a; }

        #pdf-template { display: none; width: 1122px; padding: 40px; background: #0f172a; color: white; }
        .pdf-header { border-bottom: 2px solid #3b82f6; padding-bottom: 20px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .pdf-table { width: 100%; border-collapse: collapse; }
        .pdf-table th { background: rgba(59, 130, 246, 0.2); color: #60a5fa; text-align: left; padding: 12px; font-size: 12px; text-transform: uppercase; border-bottom: 2px solid #3b82f6; }
        .pdf-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
        .potencia-tag-pdf { background: #3b82f6; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <img src="https://lh3.googleusercontent.com/d/1VFKoeTjJ3R6MBjqf9Q0fkwcnV8cJTS-U" alt="Logo FullCharge" class="logo-img">
            </div>
            <p class="subtitle">Gestão de Estações</p>
        </div>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Procurar estação..." onkeyup="filterStations()">
        </div>

        <div class="actions-bar">
            <button class="btn-action btn-select-all" onclick="toggleAll(true)">✓ Marcar Todos</button>
            <button class="btn-action btn-deselect" onclick="toggleAll(false)">✕ Limpar</button>
        </div>

        <div id="stationList">
            <div class="loading-msg">🔄 Sincronizando estações...</div>
        </div>
        
        <div class="sidebar-footer">
            <button class="btn-report" onclick="generatePDF()">📊 Gerar Relatório PDF</button>
        </div>
    </div>
    <div id="map"></div>
</div>

<div id="passwordModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>Acesso Restrito</h3>
        <p>Digite a senha para alterar o status para <strong>Disponível</strong>.</p>
        <input type="password" id="passwordInput" placeholder="Sua senha">
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            <button class="btn-confirm" onclick="confirmPassword()">Confirmar</button>
        </div>
    </div>
</div>

<div id="pdf-template">
    <div class="pdf-header">
        <div>
            <h1 style="margin:0; font-size: 28px;">Relatório de Ativos</h1>
            <p style="color:#60a5fa; font-weight:700; margin:5px 0 0;">FULLCHARGE INFRASTRUCTURE</p>
        </div>
        <img src="https://lh3.googleusercontent.com/d/1VFKoeTjJ3R6MBjqf9Q0fkwcnV8cJTS-U" style="height:50px;">
    </div>
    <table class="pdf-table">
        <thead>
            <tr>
                <th style="width:35%">Estação</th>
                <th style="width:25%">Município</th>
                <th style="width:15%">Potência</th>
                <th style="width:25%">Coordenadas</th>
            </tr>
        </thead>
        <tbody id="pdf-table-body"></tbody>
    </table>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzM55m75duq8ySSFf9lpzeh-0IGwTQTHw8Xz8zDgANwJHaWYoEXrF3qN_gh7ZSLz4A/exec";
    const iconUrl = "https://lh3.googleusercontent.com/d/1ywz6_yQYzvAhd3lMx3R4Q1UvniyBuBwx";
    let allStationsData = [];
    let mapMarkers = [];
    let currentStationIndex = null; // Guarda qual estação estamos tentando alterar
    
    const map = L.map('map').setView([-23.5505, -46.6333], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    async function loadStations() {
        try {
            const response = await fetch(API_URL);
            allStationsData = await response.json();
            updateUI(allStationsData);
        } catch (e) { 
            console.error(e); 
            document.getElementById('stationList').innerHTML = '<div class="loading-msg">Erro ao carregar dados.</div>';
        }
    }

    // 1. Função chamada ao clicar no carrinho
    function toggleStatus(index, event) {
        event.stopPropagation(); 

        const s = allStationsData[index];
        const statusValue = (s.status || s.Status || s.situacao || s.Situacao || s.venda || "").toString().toLowerCase();
        const isVendida = statusValue.includes('vendid');

        if (isVendida) {
            // Se já está vendida, abre o Modal para pedir a senha e esconde o texto
            currentStationIndex = index;
            document.getElementById('passwordInput').value = ''; // Limpa campos antigos
            document.getElementById('passwordModal').style.display = 'flex';
            document.getElementById('passwordInput').focus();
        } else {
            // Se estava Disponível, vende direto (não precisa de senha)
            s.status = 'Vendida';
            updateUI(allStationsData);
            filterStations(); 
        }
    }

    // 2. Fechar o modal caso a pessoa desista
    function closeModal() {
        document.getElementById('passwordModal').style.display = 'none';
        currentStationIndex = null;
    }

    // 3. Confirmar a senha digitada no modal
    function confirmPassword() {
        if (currentStationIndex === null) return;

        const senhaDigitada = document.getElementById('passwordInput').value;
        const s = allStationsData[currentStationIndex];
        const senhaCorreta = (s.senha || s.Senha || "").toString().trim();

        if (senhaDigitada !== senhaCorreta) {
            alert("Senha incorreta! Não é possível alterar o status para Disponível.");
            return;
        }

        // Senha correta: Altera para disponível
        s.status = 'Disponível';
        updateUI(allStationsData);
        filterStations();
        closeModal();
    }

    // Permite apertar "Enter" no teclado para confirmar a senha
    document.getElementById('passwordInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            confirmPassword();
        }
    });

    function updateUI(stations) {
        const list = document.getElementById('stationList');
        list.innerHTML = '';
        
        mapMarkers.forEach(marker => map.removeLayer(marker));
        mapMarkers = [];
        
        stations.forEach((s, index) => {
            const lat = parseFloat(s.lat);
            const lng = parseFloat(s.lng);
            const valorPotencia = (s.potencia || s.Potencia || "").toString().trim();

            const statusValue = (s.status || s.Status || s.situacao || s.Situacao || s.venda || "").toString().toLowerCase();
            const isVendida = statusValue.includes('vendid');

            if(!isNaN(lat) && !isNaN(lng)) {
                const popupHTML = `
                    <div style="text-align:center; min-width:140px;">
                        <strong style="color:${isVendida ? 'var(--primary)' : 'var(--accent)'}; font-size:14px;">${s.name}</strong><br>
                        ${valorPotencia ? `<small>Trafo: ${valorPotencia}</small><br>` : ''}
                        <span class="badge-status ${isVendida ? 'badge-vendida' : 'badge-disponivel'}">
                            ${isVendida ? '🟢 Vendida' : '🔵 Disponível'}
                        </span><br><br>
                        <button class="btn-popup" style="background:${isVendida ? 'var(--primary)' : 'var(--accent)'};" onclick="openStreetViewPopup(${lat}, ${lng})">Ver Street View</button>
                    </div>`;

                const colorCircleMarker = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="${isVendida ? 'piscar-verde' : ''}" style="
                        background-color: ${isVendida ? 'var(--primary)' : 'var(--accent)'}; 
                        width: 44px; height: 44px; 
                        border-radius: 50%; 
                        display: flex; align-items: center; justify-content: center;
                        border: 3px solid white;
                        ${isVendida ? '' : 'box-shadow: 0 3px 6px rgba(0,0,0,0.3);'}
                    ">
                        <img src="${iconUrl}" style="width: 26px; height: 26px; object-fit: contain;">
                    </div>`,
                    iconSize: [44, 44],
                    iconAnchor: [22, 44],
                    popupAnchor: [0, -44]
                });

                const marker = L.marker([lat, lng], { icon: colorCircleMarker }).addTo(map).bindPopup(popupHTML);
                mapMarkers.push(marker);
            }

            const card = document.createElement('div');
            card.className = `station-card ${isVendida ? 'card-vendida' : 'card-disponivel'}`;
            card.setAttribute('data-name', s.name.toLowerCase());
            card.setAttribute('data-municipio', (s.municipio || "").toLowerCase());
            
            const htmlPotencia = valorPotencia ? `<span class="potencia-blink">${valorPotencia}</span>` : '';
            const htmlStatus = `<span class="badge-status ${isVendida ? 'badge-vendida' : 'badge-disponivel'}">
                                   ${isVendida ? 'Vendida' : 'Disponível'}
                                </span>`;

            const cartIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>`;

            card.innerHTML = `
                <input type="checkbox" class="select-box" data-index="${index}">
                <img src="${iconUrl}" class="mini-icon">
                <div style="flex:1">
                    <strong>${s.name}</strong><br>
                    <small style="color:#64748b">${s.municipio || ''}</small>
                    ${htmlPotencia}
                    ${htmlStatus}
                </div>
                <button class="btn-cart ${isVendida ? 'cart-vendida' : 'cart-disponivel'}" onclick="toggleStatus(${index}, event)" title="Alternar status de venda">
                    ${cartIcon}
                </button>`;
            
            card.onclick = (e) => { 
                if(e.target.type !== 'checkbox' && !e.target.closest('.btn-cart')) {
                    map.flyTo([lat, lng], 16); 
                }
            };
            list.appendChild(card);
        });
    }

    function filterStations() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.getElementsByClassName('station-card');
        for (let card of cards) {
            const visible = card.getAttribute('data-name').includes(input) || card.getAttribute('data-municipio').includes(input);
            card.style.display = visible ? "flex" : "none";
        }
    }

    function toggleAll(status) {
        document.querySelectorAll('.select-box').forEach(cb => {
            if(cb.closest('.station-card').style.display !== 'none') cb.checked = status;
        });
    }

    function openStreetViewPopup(lat, lng) {
        window.open(`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`, 'StreetView', 'width=900,height=600');
    }

    function generatePDF() {
        const selected = document.querySelectorAll('.select-box:checked');
        if (selected.length === 0) return alert("Selecione estações para o relatório.");
        const tableBody = document.getElementById('pdf-table-body');
        tableBody.innerHTML = '';
        selected.forEach(cb => {
            const s = allStationsData[cb.getAttribute('data-index')];
            tableBody.innerHTML += `
                <tr>
                    <td style="font-weight:700">${s.name}</td>
                    <td>${s.municipio || ''}</td>
                    <td><span class="potencia-tag-pdf">${s.potencia || s.Potencia || '-'}</span></td>
                    <td style="font-family:monospace; font-size:11px">${s.lat}, ${s.lng}</td>
                </tr>`;
        });
        const element = document.getElementById('pdf-template');
        element.style.display = 'block';
        html2pdf().set({ margin: 0, filename: 'Relatorio_FullCharge.pdf', jsPDF: { format: 'a4', orientation: 'landscape' } })
            .from(element).save().then(() => { element.style.display = 'none'; });
    }

    loadStations();
</script>
</body>
</html>
