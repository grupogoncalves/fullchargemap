<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Estações | FullCharge</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        :root { 
            --primary: #00A86B; /* Verde - Vendida */
            --accent: #1D4ED8;  /* Azul Principal - Disponível */
            --bg: #F8FAFC; 
            --white: #FFFFFF; 
            --text: #0F172A; 
            --border: #E2E8F0; 
        }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); overflow: hidden; }
        #app-container { display: grid; grid-template-columns: 380px 1fr; height: 100vh; position: relative; }
        
        #sidebar { background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; z-index: 1000; }
        .sidebar-header { padding: 25px 20px 15px; text-align: center; flex-shrink: 0; border-bottom: 1px solid var(--border); }
        
        /* CONTAINER DA LOGO OFICIAL */
        .logo-container { width: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
        .logo-svg { width: 190px; height: auto; }
        .subtitle { color: #64748B; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin: 8px 0 0 0; }

        .search-container { padding: 15px 20px 10px; background: #fff; }
        #searchInput { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Inter', sans-serif; outline: none; box-sizing: border-box; font-size: 14px; }

        .actions-bar { padding: 0 20px 10px; display: flex; gap: 8px; background: #fff; border-bottom: 1px solid var(--border); }
        .btn-action { flex: 1; padding: 8px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: white; }
        .btn-deselect { color: #ef4444; }
        .btn-select-all { color: var(--primary); }

        #stationList { flex: 1; overflow-y: auto; padding: 15px; background: #fcfcfc; }
        .loading-msg { text-align: center; padding: 40px 20px; color: #64748b; font-weight: 600; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .station-card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .station-card:hover { border-color: #CBD5E1; background: #F8FAFC; }
        .select-box { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
        
        .mini-icon-fc { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        .potencia-blink { font-weight: 800; font-size: 12px; display: block; margin-top: 3px; animation: flash 1.2s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .card-vendida { border-left: 4px solid var(--primary); }
        .card-disponivel { border-left: 4px solid var(--accent); }

        .badge-status { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; }
        .badge-vendida { background: #dcfce7; color: var(--primary); }
        .badge-disponivel { background: #dbeafe; color: var(--accent); }

        .btn-cart { background: transparent; border: none; padding: 5px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-cart:hover { transform: scale(1.15); }
        .cart-vendida { color: var(--primary); }
        .cart-disponivel { color: var(--accent); }

        .piscar-verde { animation: radar-verde 1.5s infinite; border-radius: 50%; }
        @keyframes radar-verde { 0% { box-shadow: 0 0 0 0 rgba(0, 168, 107, 0.6); } 70% { box-shadow: 0 0 0 10px rgba(0, 168, 107, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 168, 107, 0); } }

        .sidebar-footer { padding: 15px; border-top: 1px solid var(--border); background: var(--white); display: flex; flex-direction: column; gap: 8px; }
        .btn-register-trigger { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; font-size: 13px; }
        
        .btn-auth-footer { background: #1E293B; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; font-size: 13px; text-align: center; }
        .btn-auth-footer:hover { background: #0F172A; }
        .footer-user-container { background: #f1f5f9; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
        .footer-user-email { font-size: 12px; font-weight: 600; color: #1E293B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .badge-user-status { font-size: 10px; padding: 3px; border-radius: 4px; font-weight: bold; text-align: center; width: fit-content; margin: 0 auto; }
        .status-pendente { background: #fef3c7; color: #d97706; }
        .status-aprovado { background: #dcfce7; color: var(--primary); }
        .btn-logout-footer { background: #ef4444; color: white; border: none; padding: 6px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; margin-top: 4px; }

        #map { height: 100%; width: 100%; z-index: 1; }
        
        .btn-popup { border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; color: #FFFFFF !important; width: 100%; text-align: center; display: block; margin-top: 8px; text-decoration: none !important; }
        .custom-div-icon { background: transparent; border: none; }

        /* MODAIS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); z-index: 2000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        .modal-content { background: var(--white); padding: 25px; border-radius: 12px; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { margin: 0 0 10px 0; color: var(--text); font-size: 18px; }
        .modal-content p { font-size: 13px; color: #64748b; margin-bottom: 15px; }
        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .modal-content input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; }
        
        .address-search-row { display: flex; gap: 6px; }
        .btn-geo { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 0 12px; font-weight: bold; cursor: pointer; font-size: 12px; }

        .row-inputs { display: flex; gap: 10px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
        .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; }
        .btn-cancel { background: #e2e8f0; color: #475569; }
        .btn-confirm { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 240 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38BDF8" />
                            <stop offset="100%" stop-color="#1D4ED8" />
                        </linearGradient>
                    </defs>
                    <path d="M15 13H48L44.5 18.5H18.5L15 13Z" fill="url(#logoGlow)"/>
                    <path d="M19 20H43.5L40 25.5H22.5L19 20Z" fill="url(#logoGlow)"/>
                    <path d="M23 27H36.5L33 32.5H26.5L23 27Z" fill="url(#logoGlow)"/>
                    <text x="60" y="33" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="800" font-size="25px" letter-spacing="-1px">FullCharge</text>
                </svg>
            </div>
            <p class="subtitle">Gestão de Estações</p>
        </div>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Procurar estação..." onkeyup="window.filterStations()">
        </div>

        <div class="actions-bar">
            <button class="btn-action btn-select-all" onclick="window.toggleAll(true)">✓ Marcar Todos</button>
            <button class="btn-action btn-deselect" onclick="window.toggleAll(false)">✕ Limpar</button>
        </div>

        <div id="stationList">
            <div class="loading-msg">🔄 Sincronizando estações...</div>
        </div>
        
        <div class="sidebar-footer">
            <button class="btn-register-trigger" onclick="window.handleOpenRegisterModal()">➕ Cadastrar Estação</button>
            <div id="authFooterBox">
                <button class="btn-auth-footer" onclick="window.openAuthModal('login')">🔒 Acessar / Cadastrar Conta</button>
            </div>
        </div>
    </div>
    
    <div id="map"></div>
</div>

<div id="authModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3 id="authModalTitle">Acessar Sistema</h3>
        <p id="authModalDesc">Entre com sua conta para liberar recursos de cadastro.</p>
        
        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="authEmail" placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="authPassword" placeholder="******">
        </div>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="window.closeAuthModal()">Voltar</button>
            <button class="btn-confirm" id="btnAuthSubmit" onclick="window.handleAuthSubmit()">Entrar</button>
        </div>
        <p style="margin-top:15px; font-size:12px;">
            <a href="#" id="authToggleLink" onclick="window.toggleAuthMode(event)" style="color:var(--accent); font-weight:600;">Não tem conta? Cadastre-se</a>
        </p>
    </div>
</div>

<div id="registerModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>Cadastrar Estação</h3>
        <p>Preencha as informações para integração no mapa.</p>
        
        <div class="form-group">
            <label>Nome / Ativo</label>
            <input type="text" id="regName" placeholder="Ex: FC-01">
        </div>
        <div class="form-group">
            <label>Município</label>
            <input type="text" id="regMunicipio" placeholder="Ex: São Paulo">
        </div>
        
        <div class="form-group">
            <label>Buscar por Endereço</label>
            <div class="address-search-row">
                <input type="text" id="regAddress" placeholder="Ex: Av. Paulista, 1000">
                <button type="button" class="btn-geo" onclick="window.convertAddressToCoords()">Buscar</button>
            </div>
        </div>

        <div class="row-inputs">
            <div class="form-group" style="flex:1;">
                <label>Lat</label>
                <input type="text" id="regLat" placeholder="-23.5505">
            </div>
            <div class="form-group" style="flex:1;">
                <label>Lng</label>
                <input type="text" id="regLng" placeholder="-46.6333">
            </div>
        </div>
        <div class="form-group">
            <label>Potência</label>
            <input type="text" id="regPotencia" placeholder="Ex: 75 kW">
        </div>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="window.closeRegisterModal()">Cancelar</button>
            <button class="btn-confirm" onclick="window.submitNewStation()">Cadastrar</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDxjgpzMCz36d4g5q-WNnPONRT9sw99tUE",
        authDomain: "estac-3a649.firebaseapp.com",
        databaseURL: "https://estac-3a649-default-rtdb.firebaseio.com",
        projectId: "estac-3a649",
        storageBucket: "estac-3a649.firebasestorage.app",
        messagingSenderId: "937644205362",
        appId: "1:937644205362:web:9d5371d8994405b903e32b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.currentUserData = null;
    window.authMode = 'login';
    window.firebaseStations = [];

    onAuthStateChanged(auth, (user) => {
        const authFooterBox = document.getElementById('authFooterBox');
        if (user) {
            const userRef = ref(db, 'usuarios/' + user.uid);
            onValue(userRef, (snapshot) => {
                const data = snapshot.val();
                window.currentUserData = data || { status: 'Pendente' };
                const isAprovado = window.currentUserData.status === 'Aprovado';
                authFooterBox.innerHTML = `
                    <div class="footer-user-container">
                        <div class="footer-user-email" title="${user.email}">${user.email}</div>
                        <span class="badge-user-status ${isAprovado ? 'status-aprovado' : 'status-pendente'}">
                            ${isAprovado ? '✓ Aprovado' : '⏳ Pendente'}
                        </span>
                        <button class="btn-logout-footer" id="btnLogOut">Desconectar</button>
                    </div>`;
                document.getElementById('btnLogOut').addEventListener('click', () => signOut(auth));
            });
        } else {
            window.currentUserData = null;
            authFooterBox.innerHTML = `<button class="btn-auth-footer" onclick="window.openAuthModal('login')">🔒 Acessar / Cadastrar Conta</button>`;
        }
    });

    // SISTEMA DE TRATAMENTO DE ERRO DE CREDENCIAIS CORRIGIDO NATIVAMENTE
    window.handleAuthSubmit = async function() {
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        if(!email || !password) return alert("Preencha todos os campos.");
        
        try {
            if (window.authMode === 'login') {
                await signInWithEmailAndPassword(auth, email, password);
                window.closeAuthModal();
            } else {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await set(ref(db, 'usuarios/' + userCredential.user.uid), { email: email, status: 'Pendente' });
                alert("Cadastro realizado! Aguarde a aprovação do administrador.");
                window.closeAuthModal();
            }
        } catch (error) { 
            console.error(error.code);
            if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                alert("E-mail ou senha incorretos. Por favor, verifique seus dados.");
            } else {
                alert("Erro na autenticação: " + error.message);
            }
        }
    };

    window.submitNewStation = async function() {
        const name = document.getElementById('regName').value.trim();
        const municipio = document.getElementById('regMunicipio').value.trim();
        const lat = parseFloat(document.getElementById('regLat').value);
        const lng = parseFloat(document.getElementById('regLng').value);
        const potencia = document.getElementById('regPotencia').value.trim();

        if(!name || isNaN(lat) || isNaN(lng)) return alert("Nome, Latitude e Longitude obrigatórios.");

        const customKey = "ESTACAO_" + Date.now();
        const novaEstacao = { name, municipio, lat, lng, potencia, status: "Disponível" };

        try {
            await set(ref(db, 'estacoes/' + customKey), novaEstacao);
            alert("Estação salva com sucesso!");
            window.closeRegisterModal();
        } catch (error) { alert("Erro ao salvar estação: " + error.message); }
    };

    onValue(ref(db, 'estacoes'), (snapshot) => {
        const fbData = snapshot.val() || {};
        window.firebaseStations = Object.keys(fbData).map(key => ({ id: key, ...fbData[key] }));
        if (typeof window.refreshAllData === "function") window.refreshAllData();
    });
</script>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwnHSAXTEWayEi7JMOABZ-zCIhLnfPeghrvPgxX-Xaw-b55Qt32q3FgO0PLn-I6RYaA/exec";
    
    let sheetStations = [];
    let mapMarkers = [];
    let map;

    document.addEventListener("DOMContentLoaded", () => {
        map = L.map('map').setView([-23.5505, -46.6333], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        loadStationsFromSheet();
    });

    window.openStreetView = function(lat, lng) {
        const urlFinal = `https://maps.google.com/maps?q=&layer=c&cbll=${lat},${lng}`;
        const mapDiv = document.getElementById('map');
        const mapRect = mapDiv.getBoundingClientRect();
        
        window.open(
            urlFinal, 
            'StreetViewViewer', 
            `width=${mapRect.width},height=${mapRect.height},top=${mapRect.top + window.screenY},left=${mapRect.left + window.screenX},resizable=yes,scrollbars=no`
        );
    };

    window.convertAddressToCoords = async function() {
        const address = document.getElementById('regAddress').value.trim();
        if (!address) return;
        const btn = document.querySelector('.btn-geo');
        btn.innerText = "⏳...";
        btn.disabled = true;

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`);
            const data = await response.json();

            if (data && data.length > 0) {
                document.getElementById('regLat').value = parseFloat(data[0].lat).toFixed(6);
                document.getElementById('regLng').value = parseFloat(data[0].lon).toFixed(6);
            } else {
                alert("Endereço não localizado.");
            }
        } catch (error) {
            console.error(error);
        } finally {
            btn.innerText = "Buscar";
            btn.disabled = false;
        }
    };

    async function loadStationsFromSheet() {
        try {
            const response = await fetch(API_URL);
            sheetStations = await response.json();
            refreshAllData();
        } catch (e) { console.error(e); }
    }

    window.refreshAllData = function() {
        window.allStationsData = [...sheetStations, ...(window.firebaseStations || [])];
        updateUI(window.allStationsData);
    };

    window.handleOpenRegisterModal = function() {
        if (!window.currentUserData || window.currentUserData.status !== 'Aprovado') return alert("Requer login e aprovação de administrador.");
        document.getElementById('registerModal').style.display = 'flex';
    };

    window.openAuthModal = function(mode) {
        window.authMode = mode;
        document.getElementById('authModal').style.display = 'flex';
        if(mode === 'login') {
            document.getElementById('authModalTitle').innerText = "Acessar Sistema";
            document.getElementById('btnAuthSubmit').innerText = "Entrar";
            document.getElementById('authToggleLink').innerText = "Não tem conta? Cadastre-se";
        } else {
            document.getElementById('authModalTitle').innerText = "Criar Conta";
            document.getElementById('btnAuthSubmit').innerText = "Cadastrar";
            document.getElementById('authToggleLink').innerText = "Já possui conta? Faça Login";
        }
    };

    window.toggleAuthMode = function(e) {
        e.preventDefault();
        window.openAuthModal(window.authMode === 'login' ? 'register' : 'login');
    };

    window.closeAuthModal = function() { document.getElementById('authModal').style.display = 'none'; };
    window.closeRegisterModal = function() { document.getElementById('registerModal').style.display = 'none'; };

    window.toggleStatus = function(index, event) {
        event.stopPropagation(); 
        if (!window.currentUserData || window.currentUserData.status !== 'Aprovado') return alert("Sem permissão para alterar status.");

        const s = window.allStationsData[index];
        const statusValue = (s.status || s.Status || "").toString().toLowerCase();
        const novoStatus = statusValue.includes('vendid') ? 'Disponível' : 'Vendida';

        s.status = novoStatus; 
        updateUI(window.allStationsData);
        window.filterStations();
        
        const ping = new Image();
        ping.src = API_URL + "?action=updateStatus&name=" + encodeURIComponent(s.name) + "&status=" + encodeURIComponent(novoStatus);
    };

    function updateUI(stations) {
        const list = document.getElementById('stationList');
        list.innerHTML = '';
        mapMarkers.forEach(marker => map.removeLayer(marker));
        mapMarkers = [];
        
        stations.forEach((s, index) => {
            const lat = parseFloat(s.lat);
            const lng = parseFloat(s.lng);
            const statusValue = (s.status || s.Status || "").toString().toLowerCase();
            const isVendida = statusValue.includes('vendid');
            
            // Variáveis de estilo baseadas nos pins oficiais em degradê
            const pinGradId = isVendida ? 'gradVerde' : 'gradAzul';
            const strokeColor = isVendida ? 'var(--primary)' : 'var(--accent)';
            const fillContentColor = isVendida ? '#A7F3D0' : '#38BDF8';
            
            const valorPotencia = (s.potencia || s.Potencia || "").toString().trim();

            if(!isNaN(lat) && !isNaN(lng)) {
                const popupHTML = `
                    <div style="text-align:center; min-width:140px;">
                        <strong style="color:${strokeColor}; font-size:14px;">${s.name}</strong><br>
                        ${valorPotencia ? `<small style="font-weight:700;">Potência: ${valorPotencia}</small><br>` : ''}
                        <button onclick="window.openStreetView(${lat}, ${lng})" class="btn-popup" style="background:${strokeColor}">
                            📷 Abrir Street View
                        </button>
                    </div>`;

                // RECONSTRUÇÃO DO SEU PIN EM GOTA OFICIAL EM SVG PURO (ANTI-QUEBRA)
                const pinSvgMarker = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="${isVendida ? 'piscar-verde' : ''}" style="width:44px; height:44px; display:flex; align-items:center; justify-content:center;">
                        <svg width="44" height="44" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="gradAzul" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#1E3A8A" />
                                    <stop offset="100%" stop-color="#0F172A" />
                                </linearGradient>
                                <linearGradient id="gradVerde" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#059669" />
                                    <stop offset="100%" stop-color="#064E3B" />
                                </linearGradient>
                            </defs>
                            <path d="M6 19C6 8.5 14.5 1 21 1C27.5 1 36 8.5 36 19C36 29.5 21 41 21 41C21 41 6 29.5 6 19Z" fill="url(#${pinGradId})" stroke="white" stroke-width="2"/>
                            <path d="M13 12H29.5L27 15.5H15.5L13 12Z" fill="${fillContentColor}"/>
                            <path d="M15.5 16.5H26.5L24 20H18L15.5 16.5Z" fill="${fillContentColor}"/>
                            <path d="M18.5 21H22.5L20.5 24.5H19.5L18.5 21Z" fill="${fillContentColor}"/>
                        </svg>
                    </div>`,
                    iconSize: [44, 44],
                    iconAnchor: [22, 44],
                    popupAnchor: [0, -44]
                });

                const marker = L.marker([lat, lng], { icon: pinSvgMarker }).addTo(map).bindPopup(popupHTML);
                mapMarkers.push(marker);
            }

            const card = document.createElement('div');
            card.className = `station-card ${isVendida ? 'card-vendida' : 'card-disponivel'}`;
            card.setAttribute('data-name', s.name.toLowerCase());
            
            const htmlPotencia = valorPotencia ? `<span class="potencia-blink" style="color:${strokeColor}">${valorPotencia}</span>` : '';
            const htmlStatus = `<span class="badge-status ${isVendida ? 'badge-vendida' : 'badge-disponivel'}">
                                   ${isVendida ? 'Vendida' : 'Disponível'}
                                </span>`;

            const cartIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>`;

            // EMBLEMA MINIATURA DENTRO DA LISTAGEM DE CARDS LATERAIS
            card.innerHTML = `
                <input type="checkbox" class="select-box" data-index="${index}">
                <div class="mini-icon-fc">
                    <svg width="34" height="34" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 19C6 8.5 14.5 1 21 1C27.5 1 36 8.5 36 19C36 29.5 21 41 21 41C21 41 6 29.5 6 19Z" fill="url(#${pinGradId})"/>
                        <path d="M12 11H29.5L27 14.5H14.5L12 11Z" fill="${fillContentColor}"/>
                        <path d="M14.5 15.5H26.5L24 19H17L14.5 15.5Z" fill="${fillContentColor}"/>
                        <path d="M17.5 20H22L20 23.5H19.5L17.5 20Z" fill="${fillContentColor}"/>
                    </svg>
                </div>
                <div style="flex:1">
                    <strong style="color: #1E293B;">${s.name}</strong><br>
                    <small style="color:#64748b; font-size:12px;">${s.municipio || ''}</small>
                    ${htmlPotencia}
                    ${htmlStatus}
                </div>
                <button class="btn-cart ${isVendida ? 'cart-vendida' : 'cart-disponivel'}" onclick="window.toggleStatus(${index}, event)">
                    ${cartIcon}
                </button>`;
            
            card.onclick = (e) => { 
                if(e.target.type !== 'checkbox' && !e.target.closest('.btn-cart')) map.flyTo([lat, lng], 15); 
            };
            list.appendChild(card);
        });
    }

    window.filterStations = function() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.getElementsByClassName('station-card');
        for (let card of cards) {
            card.style.display = card.getAttribute('data-name').includes(input) ? "flex" : "none";
        }
    };
    window.toggleAll = function(status) { document.querySelectorAll('.select-box').forEach(cb => cb.checked = status); };
</script>
</body>
</html>
